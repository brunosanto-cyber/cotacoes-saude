<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Cotações - Saúde</title>
    <!-- Código adicionado para o ícone da aba do navegador -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        :root {
            --primary: #1e3a8a; /* blue-900 */
            --primary-hover: #1e40af;
            --secondary: #475569; /* slate-600 */
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-light: #64748b;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-image {
            height: 65px;
            width: auto;
            margin-bottom: 1rem;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 0.5rem;
            margin-top: 0;
        }
        .search-container {
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto 2rem auto;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .secondary-btn {
            background-color: var(--secondary);
        }
        .secondary-btn:hover {
            background-color: #334155;
        }
        #loading {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            display: none;
        }
        #results-area {
            display: none;
        }
        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 4px -1px rgba(0,0,0,0.05);
        }
        .company-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            margin: 0;
        }
        .quote-count {
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 500;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .tabs {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            padding-bottom: 5px;
        }
        .tab {
            padding: 8px 16px;
            background: #e2e8f0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 600;
            color: var(--secondary);
        }
        .tab.active {
            background: var(--primary);
            color: white;
        }
        .quote-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: none;
        }
        .quote-card.active {
            display: block;
        }
        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .section-title {
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: var(--secondary);
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
            margin-top: 1rem;
            font-weight: bold;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-light);
            text-transform: uppercase;
        }
        .field-value {
            font-size: 1rem;
            font-weight: 500;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: bold;
            color: white;
            text-align: center;
        }
        .status-success { background-color: var(--success); }
        .status-warning { background-color: var(--warning); color: #000; }
        .status-danger { background-color: var(--danger); }
        .status-default { background-color: var(--secondary); }
        
        @media (max-width: 768px) {
            .summary-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <img src="logo-unimed.png" alt="Logo Seguros Unimed" class="logo-image">
            <h1>Consulta de Cotações</h1>
            <p>Busque pelo CNPJ da empresa para visualizar as cotações</p>
        </header>

        <div class="search-container">
            <input type="text" id="cnpj-input" placeholder="Digite o CNPJ (com ou sem máscara)..." autocomplete="off">
            <button id="search-btn">Buscar</button>
        </div>

        <div id="loading">Carregando base de dados...</div>
        
        <div id="error-message" style="display: none; text-align: center; color: var(--danger); font-weight: bold; margin-bottom: 1rem;"></div>

        <div id="results-area">
            <div class="summary-header">
                <div>
                    <h2 class="company-name" id="display-company-name">-</h2>
                    <div style="margin-top: 10px; display: flex; align-items: center; gap: 12px;">
                        <span class="status-badge" id="display-status-top" style="font-size: 1rem; padding: 6px 16px;">-</span>
                        <span class="quote-count" id="display-quote-count">-</span>
                    </div>
                </div>
                <div class="actions">
                    <button class="secondary-btn" id="copy-btn">Copiar CNPJ</button>
                    <button class="secondary-btn" id="export-btn">Exportar CSV</button>
                </div>
            </div>

            <div class="tabs" id="quote-tabs"></div>
            
            <div id="quotes-container"></div>
        </div>
    </div>

    <script>
        let quotesData = [];
        let currentResults = [];
        let currentCnpjSearched = "";

        const cnpjInput = document.getElementById('cnpj-input');
        const searchBtn = document.getElementById('search-btn');
        const loadingEl = document.getElementById('loading');
        const errorEl = document.getElementById('error-message');
        const resultsArea = document.getElementById('results-area');
        const displayCompanyName = document.getElementById('display-company-name');
        const displayQuoteCount = document.getElementById('display-quote-count');
        const displayStatusTop = document.getElementById('display-status-top');
        const quoteTabs = document.getElementById('quote-tabs');
        const quotesContainer = document.getElementById('quotes-container');
        const copyBtn = document.getElementById('copy-btn');
        const exportBtn = document.getElementById('export-btn');

        async function loadData() {
            loadingEl.style.display = 'block';
            try {
                const response = await fetch('dados.json');
                if (!response.ok) throw new Error('Arquivo dados.json não encontrado.');
                quotesData = await response.json();
                loadingEl.style.display = 'none';
                cnpjInput.focus();
            } catch (err) {
                loadingEl.style.display = 'none';
                showError("Erro ao carregar a base de dados. Verifique se o arquivo dados.json está na mesma pasta.");
                console.error(err);
            }
        }

        function normalizeCNPJ(cnpj) {
            if (!cnpj) return "";
            return String(cnpj).replace(/[^\d]/g, '');
        }

        function formatCNPJ(cnpj) {
            const num = normalizeCNPJ(cnpj);
            if (num.length !== 14) return cnpj;
            return num.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5");
        }

        function formatCurrency(val) {
            if (val === undefined || val === null || val === "" || val === "-") return '-';
            const num = parseFloat(String(val).replace(',','.'));
            if (isNaN(num)) return val;
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(num);
        }

        function formatPercent(val) {
            if (val === undefined || val === null || val === "" || val === "-") return '-';
            let strVal = String(val);
            if (strVal.includes('%')) return strVal;
            
            let num = parseFloat(strVal.replace(',','.'));
            if (isNaN(num)) return val;
            
            // Multiplicamos por 100 os números na faixa padrão
            if (num <= 10 && num >= -10) { 
                num = num * 100;
            }
            
            return num.toFixed(2).replace('.', ',') + '%';
        }

        function getStatusClass(status) {
            if (!status) return 'status-default';
            const s = String(status).toLowerCase();
            if (s.includes('aprov') || s.includes('fechad') || s.includes('ganho') || s.includes('emitid')) return 'status-success';
            if (s.includes('pendente') || s.includes('análise') || s.includes('andamento') || s.includes('negocia')) return 'status-warning';
            if (s.includes('reprov') || s.includes('cancel') || s.includes('declin') || s.includes('perdid')) return 'status-danger';
            return 'status-default';
        }

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
            resultsArea.style.display = 'none';
        }

        function handleSearch() {
            const rawInput = cnpjInput.value.trim();
            if (!rawInput) return;

            errorEl.style.display = 'none';
            const searchStr = normalizeCNPJ(rawInput);

            if (searchStr.length < 3) {
                showError("Digite pelo menos 3 números para realizar a busca parcial.");
                return;
            }

            currentResults = quotesData.filter(row => {
                const rowCnpj = normalizeCNPJ(row['CNPJ']);
                return rowCnpj.includes(searchStr);
            });

            if (currentResults.length === 0) {
                showError("Nenhum resultado encontrado para este CNPJ.");
                return;
            }

            currentCnpjSearched = rawInput;
            renderResults();
        }

        function renderResults() {
            resultsArea.style.display = 'block';
            
            const companyName = currentResults[0]['NOME DA EMPRESA'] || "Empresa sem nome";
            const actualCnpj = currentResults[0]['CNPJ'] || "";
            displayCompanyName.textContent = companyName + ` (${formatCNPJ(actualCnpj)})`;
            displayQuoteCount.textContent = `${currentResults.length} cotaç${currentResults.length === 1 ? 'ão' : 'ões'} encontrada(s)`;

            // Seta o status da primeira cotação no cabeçalho destacado
            const firstStatus = currentResults[0]['SITUAÇÃO'] || "-";
            displayStatusTop.textContent = firstStatus;
            displayStatusTop.className = 'status-badge ' + getStatusClass(firstStatus);

            quoteTabs.innerHTML = '';
            quotesContainer.innerHTML = '';

            currentResults.forEach((quote, index) => {
                const tab = document.createElement('button');
                tab.className = `tab ${index === 0 ? 'active' : ''}`;
                const numCot = quote['NÚMERO DA COTAÇÃO'];
                tab.textContent = numCot ? `Cotação ${numCot}` : `Cenário ${index + 1}`;
                tab.onclick = () => switchTab(index);
                quoteTabs.appendChild(tab);

                const card = document.createElement('div');
                card.className = `quote-card ${index === 0 ? 'active' : ''}`;
                card.id = `card-${index}`;

                card.innerHTML = buildCardHTML(quote);
                quotesContainer.appendChild(card);
            });
        }

        function switchTab(activeIndex) {
            document.querySelectorAll('.tab').forEach((tab, i) => {
                tab.classList.toggle('active', i === activeIndex);
            });
            document.querySelectorAll('.quote-card').forEach((card, i) => {
                card.classList.toggle('active', i === activeIndex);
            });

            // Atualiza o status destacado no cabeçalho ao trocar de aba
            const currentStatus = currentResults[activeIndex]['SITUAÇÃO'] || "-";
            displayStatusTop.textContent = currentStatus;
            displayStatusTop.className = 'status-badge ' + getStatusClass(currentStatus);
        }

        function renderField(label, value, format = 'text') {
            if (value === undefined || value === null || value === "") value = "-";
            
            let formattedValue = value;
            if (value !== "-") {
                if (format === 'currency') formattedValue = formatCurrency(value);
                else if (format === 'percent') formattedValue = formatPercent(value);
                else if (format === 'status') {
                    formattedValue = `<span class="status-badge ${getStatusClass(value)}">${value}</span>`;
                }
            }

            return `
                <div class="field">
                    <span class="field-label">${label}</span>
                    <span class="field-value">${formattedValue}</span>
                </div>
            `;
        }

        function buildCardHTML(quote) {
            return `
                <div class="grid-section">
                    <div class="section-title">Identificação da Empresa</div>
                    ${renderField('CNPJ', formatCNPJ(quote['CNPJ']))}
                    ${renderField('Nome da Empresa', quote['NOME DA EMPRESA'])}
                    ${renderField('Vidas', quote['VIDAS'])}
                    ${renderField('Apresentou Vida?', quote['APRESENTOU VIDA?'])}
                </div>
                
                <div class="grid-section">
                    <div class="section-title">Dados da Cotação</div>
                    ${renderField('Número da Cotação', quote['NÚMERO DA COTAÇÃO'])}
                    ${renderField('Data da Análise', quote['DATA DA ANÁLISE'])}
                    ${renderField('Cenário', quote['CENÁRIO'])}
                    ${renderField('Analista', quote['ANALISTA'])}
                    ${renderField('Congênere', quote['CONGÊNERE'])}
                    ${renderField('Produto', quote['PRODUTO'])}
                    ${renderField('Rede', quote['REDE'])}
                    ${renderField('Tipo de Contratação', quote['TIPO DE CONTRATAÇÃO'])}
                </div>

                <div class="grid-section">
                    <div class="section-title">Condições Comerciais</div>
                    ${renderField('Estimativa de Fatura', quote['ESTIMATIVA DE FATURA'], 'currency')}
                    ${renderField('Faturamento Macro', quote['FATURAMENTO MACRO'], 'percent')}
                    ${renderField('Faturamento Necessário', quote['FATURAMENTO NECESSÁRIO'], 'percent')}
                    ${renderField('Comissão', quote['COMISSÃO'], 'percent')}
                    ${renderField('Agenciamento', quote['AGENCIAMENTO'], 'percent')}
                    ${renderField('Agravo/Desconto', quote['AGRAVO/DESCONTO'], 'percent')}
                    ${renderField('Reajuste Anual', quote['REAJUSTE ANUAL'], 'percent')}
                    ${renderField('Coparticipação', quote['COPARTICIPAÇÃO'], 'percent')}
                    ${renderField('Sinistralidade Congênere', quote['SINISTRALIDADE CONGÊNERE'], 'percent')}
                    ${renderField('DA', quote['DA'], 'percent')}
                    ${renderField('ML', quote['ML'], 'percent')}
                    ${renderField('Diluição', quote['DILUIÇÃO'])}
                </div>

                <div class="grid-section">
                    <div class="section-title">Situação e Observações</div>
                    ${renderField('Situação', quote['SITUAÇÃO'], 'status')}
                    ${renderField('Prioridade', quote['PRIORIDADE'])}
                    ${renderField('Chance Fechamento', quote['CHANCE FECHAMENTO'])}
                    ${renderField('Corretor', quote['CORRETOR'])}
                    ${renderField('Escritório Regional', quote['ESCRITÓRIO REGIONAL'])}
                    ${renderField('Origem', quote['ORIGEM'])}
                    ${renderField('Relatório de Sinistralidade', quote['RELATÓRIO DE SINISTRALIDADE'])}
                </div>
                
                <div class="grid-section">
                    <div class="field" style="grid-column: 1 / -1;">
                        <span class="field-label">Observações</span>
                        <div style="margin-top: 4px; padding: 12px; background: #f1f5f9; border-radius: 4px; white-space: pre-wrap; line-height: 1.5;">${quote['OBSERVAÇÕES'] || '-'}</div>
                    </div>
                </div>
            `;
        }

        function exportToCSV() {
            if (!currentResults.length) return;
            
            const headers = Object.keys(currentResults[0]);
            
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            csvContent += headers.join(";") + "\n";
            
            currentResults.forEach(row => {
                const rowStr = headers.map(h => {
                    let val = row[h];
                    if (val === null || val === undefined) val = "";
                    val = String(val).replace(/"/g, '""').replace(/\n/g, ' '); 
                    return `"${val}"`;
                }).join(";");
                csvContent += rowStr + "\n";
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `cotacoes_${normalizeCNPJ(currentCnpjSearched)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        searchBtn.addEventListener('click', handleSearch);
        cnpjInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
        
        copyBtn.addEventListener('click', () => {
            if(currentResults.length > 0) {
                navigator.clipboard.writeText(formatCNPJ(currentResults[0]['CNPJ']))
                .then(() => alert("CNPJ copiado!"))
                .catch(err => console.error("Erro ao copiar", err));
            }
        });

        exportBtn.addEventListener('click', exportToCSV);

        loadData();
    </script>
</body>
</html>
